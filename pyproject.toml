[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-feedback-lakehouse"
version = "0.1.0"
description = "A reproducible batch and streaming customer-feedback lakehouse"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rishav Singhania" }]
dependencies = [
  "confluent-kafka>=2.5,<3",
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "dbt-duckdb>=1.9,<1.10",
  "dbt-core>=1.9,<1.10",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
dashboard = ["streamlit>=1.40,<2"]
spark = ["pyspark>=3.5,<4.1"]

[project.scripts]
feedback-lakehouse = "feedback_lakehouse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["._*", "**/._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
