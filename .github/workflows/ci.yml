name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest --cov=feedback_lakehouse --cov-report=term-missing --cov-fail-under=85
      - name: Run the deterministic pipeline
        run: feedback-lakehouse demo --database build/lakehouse.duckdb
      - name: Build and test dbt marts
        working-directory: dbt
        env:
          LAKEHOUSE_DB: ../build/lakehouse.duckdb
        run: dbt build --profiles-dir .
      - name: Build application image
        run: docker build -t customer-feedback-lakehouse:test .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Initialise without a remote backend
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate
