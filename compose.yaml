services:
  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.8.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-init:
    image: redpandadata/redpanda:v24.3.5
    entrypoint: /bin/sh
    command: >-
      -c "rpk topic create feedback-events --brokers redpanda:9092
      --partitions 3 --replicas 1 || true"
    depends_on:
      redpanda:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    entrypoint: /bin/sh
    command: >-
      -c "mc alias set local http://minio:9000 admin password123 &&
      mc mb --ignore-existing local/warehouse"
    depends_on:
      minio:
        condition: service_healthy

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
    ports: ["8181:8181"]
    depends_on:
      minio-init:
        condition: service_completed_successfully

  ingestion-api:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: feedback-events
    ports: ["8000:8000"]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  spark-stream:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5
      - --conf
      - spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
      - --conf
      - spark.sql.catalog.lakehouse.type=rest
      - --conf
      - spark.sql.catalog.lakehouse.uri=http://iceberg-rest:8181
      - --conf
      - spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO
      - --conf
      - spark.sql.catalog.lakehouse.s3.endpoint=http://minio:9000
      - --conf
      - spark.sql.catalog.lakehouse.s3.path-style-access=true
      - /opt/lakehouse/jobs/spark_streaming_job.py
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: feedback-events
      CHECKPOINT_ROOT: s3a://warehouse/checkpoints
    volumes:
      - ./jobs:/opt/lakehouse/jobs:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
    profiles: ["streaming"]

  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.address=0.0.0.0
    environment:
      LAKEHOUSE_DB: /app/build/lakehouse.duckdb
    ports: ["8501:8501"]
    volumes:
      - ./app:/app/app:ro
      - ./build:/app/build:ro
    profiles: ["dashboard"]

volumes:
  minio-data:
